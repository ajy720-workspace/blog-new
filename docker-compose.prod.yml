# Docker Compose for Production Environment
services:
  blog-prod:
    image: ${IMAGE_NAME_WITH_TAG:-ghcr.io/ajy720-workspace/blog:prod-latest}
    container_name: blog-prod
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_SITE_URL=https://blog.ajy720.me
    env_file:
      - .env.prod
    restart: unless-stopped
    labels:
      - 'environment=production'
      - 'app=blog'
