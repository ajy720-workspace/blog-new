name: Security Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run security audit weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run security audit
        run: yarn audit --level moderate

      - name: Run dependency license check
        run: |
          # Install license checker
          npm install -g license-checker

          # Generate license report
          license-checker --json --out licenses.json

          # Check for problematic licenses by excluding known problematic ones
          # This approach is more flexible than --onlyAllow
          license-checker --failOn 'GPL-3.0;AGPL-3.0;GPL-2.0;LGPL-2.1;LGPL-2.0;GPL-1.0;AGPL-1.0;SSPL-1.0;OSL-3.0;EPL-1.0;EPL-2.0;CDDL-1.0;CDDL-1.1' || {
            echo "❌ Problematic licenses detected!"
            echo "📋 Generating detailed license report..."
            license-checker --summary
            exit 1
          }

          echo "✅ License check passed - no problematic licenses found"
          echo "📊 License summary:"
          license-checker --summary

      - name: Upload security audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-results
          path: |
            yarn-audit.log
            npm-audit.log
            licenses.json
          retention-days: 30
