name: Deploy to Production

on:
  push:
    tags:
      - 'v*.*.*' # Semantic versioning tags (v1.0.0, v1.2.3, etc.)
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # Job 1: Lint and Build
  build-and-push:
    name: Build and Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.meta.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js for linting
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies for linting
        run: yarn install --frozen-lockfile

      - name: Run linting
        run: yarn lint

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
            NEXT_PUBLIC_SITE_URL=https://blog.ajy720.me
          secrets: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            SESSION_SECRET=${{ secrets.SESSION_SECRET }}
            GITHUB_CLIENT_ID=${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
            GITHUB_CLIENT_SECRET=${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
            NOTION_DATABASE_ID=${{ secrets.NOTION_DATABASE_ID }}
            NOTION_API_KEY=${{ secrets.NOTION_API_KEY }}
            REVALIDATE_SECRET=${{ secrets.REVALIDATE_SECRET }}
            NOTION_WEBHOOK_SECRET=${{ secrets.NOTION_WEBHOOK_SECRET }}

  # Job 2: Deploy to Production
  deploy:
    name: Deploy to Production Server
    runs-on: self-hosted
    needs: build-and-push
    environment:
      name: production
      url: https://blog.ajy720.me
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create .env.prod file from secrets
        run: |
          cat > .env.prod << EOF
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          GITHUB_CLIENT_ID=${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET=${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NOTION_API_KEY=${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID=${{ secrets.NOTION_DATABASE_ID }}
          REVALIDATE_SECRET=${{ secrets.REVALIDATE_SECRET }}
          NOTION_WEBHOOK_SECRET=${{ secrets.NOTION_WEBHOOK_SECRET }}
          EOF

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy with Docker Compose
        run: |
          # Extract the first tag (version tag) from the multi-line tags output
          IMAGE_TAG=$(echo "${{ needs.build-and-push.outputs.image-tag }}" | head -n1)
          echo "Using image tag: $IMAGE_TAG"
          echo "Deploying version: ${{ github.ref_name }}"

          # Pull and start the updated image
          IMAGE_NAME_WITH_TAG="$IMAGE_TAG" docker compose -f ${{ github.workspace }}/docker-compose.prod.yml pull

          IMAGE_NAME_WITH_TAG="$IMAGE_TAG" docker compose -f ${{ github.workspace }}/docker-compose.prod.yml up -d --remove-orphans

      - name: Smoke test production deployment
        run: |
          for attempt in {1..12}; do
            if curl -fsS http://127.0.0.1:3000/api/health; then
              echo "Production health check passed"
              exit 0
            fi

            echo "Waiting for production health check... attempt ${attempt}/12"
            sleep 5
          done

          echo "Production health check failed"
          docker compose -f ${{ github.workspace }}/docker-compose.prod.yml ps
          exit 1

      - name: Clean up old images
        run: |
          # Remove unused images to free up disk space
          docker image prune -af

      - name: Notify deployment success
        run: |
          echo "🎉 Production deployment successful!"
          echo "Version: ${{ github.ref_name }}"
          echo "URL: https://blog.ajy720.me"
          echo "Commit: ${{ github.sha }}"
          echo "Docker Image: ${{ needs.build-and-push.outputs.image-tag }}"
