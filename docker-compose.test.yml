# Docker Compose for Test Environment
services:
  blog-test:
    image: ${IMAGE_NAME_WITH_TAG:-ghcr.io/ajy720-workspace/blog:test-latest}
    container_name: blog-test
    ports:
      - '3001:3000'
    environment:
      - NEXT_PUBLIC_SITE_URL=https://blog-test.ajy720.me
    env_file:
      - .env.test
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    labels:
      - 'environment=test'
      - 'app=blog'
